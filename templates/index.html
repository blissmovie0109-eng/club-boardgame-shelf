{% extends "base.html" %}
{% block content %}
<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-title"><img class="brand-logo" src="{{ url_for('kiribo_logo') }}" alt="Kiribo 로고"><span>{{ club_name }}</span></div>
    <a class="manage-button" href="{{ url_for('admin') }}">관리 모드</a>
  </div>
</header>
<main class="collection-page">
  <section class="collection-toolbar">
    <div class="toolbar-left">
      <div class="sort-group"><strong>정렬:</strong><button class="sort-btn active" data-sort="weight">웨이트</button><button class="sort-btn" data-sort="name">이름순</button></div>
      <label class="collection-search"><input id="search" type="search" placeholder="게임 이름 검색"></label>
      <div class="player-group" id="playerFilters"><strong>인원:</strong><button class="filter-btn active" data-players="0">전체</button>{% for n in [2,3,4,5,6] %}<button class="filter-btn" data-players="{{n}}">{{n}}인{% if n == 6 %}+{% endif %}</button>{% endfor %}</div>
      <label class="weight-filter">웨이트:
        <select id="weightFilter">
          <option value="">전체</option>
          <option value="1">1.0~1.99</option>
          <option value="2">2.0~2.99</option>
          <option value="3">3.0~3.99</option>
          <option value="4">4.0~5.0</option>
        </select>
      </label>
    </div>
    <div class="toolbar-right">
      <label class="location-filter">보유 장소:
        <select id="locationFilter"><option value="">전체보기</option>{% for location in locations %}<option value="{{ location|lower }}">{{ location }}</option>{% endfor %}</select>
      </label>
      <span class="count-badge"><b id="visibleCount">{{ total_games }}</b>개</span>
    </div>
  </section>

  <section class="picker-panel">
    <div class="picker-copy">
      <span class="picker-eyebrow">오늘 뭐 하지?</span>
      <h2>조건에 맞는 게임 하나 골라드릴게요</h2>
      <p>인원·웨이트·보유 장소 조건에서 한 게임을 뽑습니다. 본판이 필요한 일반 확장은 자동으로 제외합니다.</p>
    </div>
    <button id="randomPick" class="random-hero-button" type="button"><span class="dice-orb">🎲</span><span><b>랜덤 게임 뽑기</b><small>오늘의 선택 보기</small></span></button>
  </section>

  <section id="todayPick" class="today-pick hidden" aria-live="polite">
    <div class="today-pick-label">✨ 오늘의 선택</div>
    <div class="today-pick-content">
      <div class="today-pick-cover" id="todayPickCover"></div>
      <div class="today-pick-copy">
        <h2 id="todayPickTitle"></h2>
        <p id="todayPickSubtitle" class="muted"></p>
        <div id="todayPickFacts" class="today-pick-facts"></div>
        <div id="todayPickActions" class="today-pick-actions"></div>
      </div>
    </div>
  </section>

  <section class="collection-grid" id="grid" aria-live="polite"></section>
  <div id="empty" class="empty hidden">조건에 맞는 게임이 없습니다.</div>

  <nav id="pager" class="pager hidden" aria-label="게임 목록 페이지">
    <button id="prevPage" type="button">← 이전</button>
    <span id="pageInfo"></span>
    <button id="nextPage" type="button">다음 →</button>
  </nav>
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% endblock %}
