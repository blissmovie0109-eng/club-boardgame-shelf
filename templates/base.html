<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#315c47">
  <meta name="description" content="{{ site_tagline }}">
  <title>{% block title %}{{ club_name }}{% endblock %}</title>

  <link rel="icon" type="image/jpeg" href="{{ url_for('kiribo_logo') }}">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ club_name }}">
  <meta property="og:title" content="{{ club_name }}">
  <meta property="og:description" content="{{ site_tagline }}">
  <meta property="og:url" content="{{ request.url }}">
  <meta property="og:image" content="{{ url_for('kiribo_logo', _external=True, _scheme='https', v='1') }}">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="282">
  <meta property="og:image:height" content="287">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ club_name }}">
  <meta name="twitter:description" content="{{ site_tagline }}">
  <meta name="twitter:image" content="{{ url_for('kiribo_logo', _external=True, _scheme='https', v='1') }}">

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin-extra.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='family.css') }}">
</head>
<body>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}<div class="toasts">{% for category, msg in messages %}<div class="toast {{category}}">{{msg}}</div>{% endfor %}</div>{% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
  <script src="{{ url_for('static', filename='site-fixes.js') }}"></script>
</body>
</html>
